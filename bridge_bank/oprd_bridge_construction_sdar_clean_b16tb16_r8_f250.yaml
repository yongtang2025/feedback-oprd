project: ALFWORLD_TCOD
name: oprd_bridge_construction_sdar_clean_b16tb16_r8_f250
checkpoint_root_dir: ./outputs/tcod_checkpoints
continue_from_checkpoint: false

algorithm:
  sample_strategy: staleness_control
  sample_strategy_args:
    max_staleness: 2
  algorithm_type: on_policy_distill
  advantage_fn: oprd_hidden_zero
  repeat_times: 1
  optimizer:
    lr: 1e-6

model:
  model_path: /path/to/Qwen3-1.7B
  max_prompt_tokens: 2048
  max_response_tokens: 512
  enable_prompt_truncation: false

cluster:
  node_num: 1
  gpu_per_node: 3

buffer:
  total_steps: 250
  batch_size: 16
  train_batch_size: 16
  explorer_input:
    taskset:
      name: alfworld
      storage_type: file
      path: ./data/alfworld/train_expert.jsonl
      split: train
      format:
        prompt_key: game_file
      rollout_args:
        temperature: 1.0
        logprobs: 0
      workflow_args:
        max_env_steps: 30
        bridge_construction_only: true
    default_workflow_type: OPRD_hidden_sdar_proj_alfworld_workflow
  trainer_input:
    experience_buffer:
      name: oprd_bridge_construction_sdar_clean_b16tb16_r8_f250_buffer
      storage_type: queue
      path: sqlite:///./outputs/tcod_checkpoints/ALFWORLD_TCOD/oprd_bridge_construction_sdar_clean_b16tb16_r8_f250/buffer/oprd_bridge_construction_sdar_clean_b16tb16_r8_f250_buffer.db

explorer:
  eval_interval: 5
  runner_per_model: 8
  max_timeout: 3600
  rollout_model:
    engine_num: 1
    tensor_parallel_size: 1
    enable_prefix_caching: false
    enforce_eager: true
    dtype: bfloat16
    seed: 42
    max_model_len: 2560
    max_prompt_tokens: 2048
    max_response_tokens: 512
    enable_prompt_truncation: false
    gpu_memory_utilization: 0.50
    enable_chunked_prefill: true
    enable_thinking: false
  auxiliary_models: []
  env_vars:
    TMPDIR: ./outputs/tmp_oprd_bridge_construction_r512
    TEMP: ./outputs/tmp_oprd_bridge_construction_r512
    TMP: ./outputs/tmp_oprd_bridge_construction_r512
    RAY_TMPDIR: ./outputs/ray_tmp_oprd_bridge_construction_r512

synchronizer:
  sync_method: nccl
  sync_style: dynamic_by_explorer
  sync_interval: 1
  sync_timeout: 3600

trainer:
  total_steps: 250
  save_interval: 50
  grad_clip: 1.0
  use_dynamic_bsz: true
  max_token_len_per_gpu: 2560
  ulysses_sequence_parallel_size: 1
  trainer_config:
    actor_rollout_ref:
      model:
        use_remove_padding: false
        override_config:
          attn_implementation: eager

monitor:
  monitor_type: swanlab
  monitor_args:
    mode: offline
    logdir: ./outputs/swanlab/oprd_bridge_construction_sdar_clean_b16tb16_r8_f250
    description: Raw 512-response bridge-construction data for joint rank64 teacher and student bridge fitting.
    tags:
      - alfworld
      - oprd_bridge
      - bridge_construction
      - raw_512
